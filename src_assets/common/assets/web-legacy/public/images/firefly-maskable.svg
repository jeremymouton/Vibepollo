<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Firefly">
  <title>Firefly</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#FBBF4B" stop-opacity="0.34" />
      <stop offset="62%" stop-color="#F59E0B" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="42%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
    <linearGradient id="trail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF4B" stop-opacity="0" />
      <stop offset="100%" stop-color="#FBBF4B" stop-opacity="0.55" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#060A18" />
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">

  <!-- The flight path, fading out behind the spark. This is what makes it read as
       a firefly rather than a generic dot: a light that is going somewhere. It is
       the first thing to disappear at small sizes, which is fine — what survives
       is a glowing point, still right. -->
  <path
    d="M112 396c58 4 104-16 138-56 30-35 44-74 78-96"
    fill="none"
    stroke="url(#trail)"
    stroke-width="26"
    stroke-linecap="round"
  />

  <!-- Halo, then the light itself. Kept well inside the safe area so the maskable
       variant can be cropped to a circle without clipping anything that matters. -->
  <circle cx="336" cy="220" r="118" fill="url(#halo)" />
  <circle cx="336" cy="220" r="52" fill="url(#core)" />
</g>
</svg>
